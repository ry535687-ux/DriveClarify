<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">DriveClarify v0 架构图</title>
  <desc id="desc">歧义指令经过两个 oracle 解释、共享 SimLingo 顺序分支、结构化后果评估、分歧和决策剩余时间计算，最终选择 ACT、ASK 或 WAIT。ASK 同时发送问题并执行 holding 控制；回答触发重新规划。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .box { fill:#ffffff; stroke:#334155; stroke-width:2.2; rx:18; }
      .oracle { fill:#fff7ed; stroke:#c2410c; }
      .model { fill:#eff6ff; stroke:#1d4ed8; }
      .eval { fill:#f5f3ff; stroke:#6d28d9; }
      .policy { fill:#ecfdf5; stroke:#047857; }
      .act { fill:#ecfeff; stroke:#0e7490; }
      .ask { fill:#fefce8; stroke:#a16207; stroke-width:3; }
      .wait { fill:#fdf2f8; stroke:#be185d; }
      .answer { fill:#fff7ed; stroke:#c2410c; }
      .title { font:700 30px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif; fill:#0f172a; }
      .label { font:700 19px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font:400 15px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif; fill:#334155; text-anchor:middle; }
      .tiny { font:400 13px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif; fill:#475569; text-anchor:middle; }
      .arrow { fill:none; stroke:#334155; stroke-width:2.5; marker-end:url(#arrow); }
      .return { fill:none; stroke:#c2410c; stroke-width:2.5; stroke-dasharray:8 6; marker-end:url(#arrow); }
      .note { fill:#ffffff; stroke:#94a3b8; stroke-width:1.5; rx:12; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="920"/>
  <text class="title" x="60" y="58">DriveClarify v0——后果感知主动澄清合同</text>
  <text x="60" y="88" style="font:400 16px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#475569">K=2 预设真值解释 · 仅受约束 HLC · 相同观测与模型 · 顺序前向 · 不使用标量风险总分</text>

  <rect class="box oracle" x="55" y="145" width="210" height="115"/>
  <text class="label" x="160" y="188">歧义指令</text>
  <text class="small" x="160" y="220">v0 使用脚本/预设真值</text>
  <text class="tiny" x="160" y="244">不代表支持自由文本解析</text>

  <rect class="box oracle" x="325" y="145" width="230" height="115"/>
  <text class="label" x="440" y="183">解释集合</text>
  <text class="small" x="440" y="214">Z = {z₁, z₂}</text>
  <text class="tiny" x="440" y="239">六个本体槽位 + 校验</text>

  <rect class="box model" x="615" y="125" width="300" height="155"/>
  <text class="label" x="765" y="168">共享 SimLingo</text>
  <text class="small" x="765" y="201">同一份预处理观测</text>
  <text class="small" x="765" y="226">同一个模型实例</text>
  <text class="small" x="765" y="251">两次顺序前向约 1.25 秒</text>

  <rect class="box model" x="975" y="145" width="245" height="115"/>
  <text class="label" x="1098" y="184">路径—速度候选</text>
  <text class="small" x="1098" y="216">τᵏ ∈ ℝ²⁰ˣ²</text>
  <text class="small" x="1098" y="242">vᵏ ∈ ℝ¹⁰ˣ²</text>

  <rect class="box eval" x="1280" y="125" width="265" height="155"/>
  <text class="label" x="1413" y="166">后果评估器</text>
  <text class="small" x="1413" y="198">任务 · 安全 · 规则</text>
  <text class="small" x="1413" y="223">不可逆性 · 舒适性</text>
  <text class="small" x="1413" y="248">时序（分项保存）</text>

  <path class="arrow" d="M265 203 H325"/>
  <path class="arrow" d="M555 203 H615"/>
  <path class="arrow" d="M915 203 H975"/>
  <path class="arrow" d="M1220 203 H1280"/>

  <rect class="box eval" x="1210" y="355" width="335" height="150"/>
  <text class="label" x="1378" y="397">结构化分歧 + TTD</text>
  <text class="small" x="1378" y="429">D_G ∨ D_S ∨ D_R ∨ D_I</text>
  <text class="small" x="1378" y="454">T_decision 与 T_clarify</text>
  <text class="tiny" x="1378" y="482">路径 L2/ADE/FDE 仅表示结构差异</text>
  <path class="arrow" d="M1413 280 V355"/>

  <rect class="box policy" x="760" y="355" width="350" height="150"/>
  <text class="label" x="935" y="396">词典序策略</text>
  <text class="small" x="935" y="429">校验 → 硬可行性</text>
  <text class="small" x="935" y="454">后果等价 → 决策关键 → 时序</text>
  <text class="small" x="935" y="479">ACT / ASK / WAIT / 回退</text>
  <path class="arrow" d="M1210 430 H1110"/>

  <rect class="box act" x="285" y="600" width="300" height="125"/>
  <text class="label" x="435" y="643">ACT(zₖ)</text>
  <text class="small" x="435" y="676">选中候选 → 控制器</text>
  <text class="tiny" x="435" y="701">只有选中计划进入 PID</text>

  <rect class="box ask" x="760" y="570" width="350" height="180"/>
  <text class="label" x="935" y="615">ASK(q)</text>
  <text class="label" x="935" y="648">= 发送问题 + 保持控制</text>
  <line x1="805" y1="670" x2="1065" y2="670" stroke="#a16207" stroke-width="1.5"/>
  <text class="small" x="935" y="702">模板问题 + H1/H2/H3/H4</text>
  <text class="tiny" x="935" y="728">ASK 获取信息；保持策略负责车辆运动</text>

  <rect class="box wait" x="1250" y="600" width="290" height="125"/>
  <text class="label" x="1395" y="643">WAIT</text>
  <text class="small" x="1395" y="676">不发新问题 + 保持策略</text>
  <text class="tiny" x="1395" y="701">不一定立即停车</text>

  <path class="arrow" d="M850 505 C760 535 610 555 520 600"/>
  <path class="arrow" d="M935 505 V570"/>
  <path class="arrow" d="M1020 505 C1120 535 1290 555 1370 600"/>

  <rect class="box answer" x="800" y="820" width="270" height="75"/>
  <text class="label" x="935" y="851">预设乘客回答</text>
  <text class="tiny" x="935" y="877">绑定澄清回合 · 重新校验</text>
  <path class="arrow" d="M935 750 V820"/>

  <rect class="box oracle" x="390" y="805" width="300" height="90"/>
  <text class="label" x="540" y="841">回答条件重规划</text>
  <text class="small" x="540" y="872">重新生成，禁止给旧计划换标签</text>
  <path class="arrow" d="M800 857 H690"/>
  <path class="return" d="M390 850 H20 V110 H765 V125"/>

  <rect class="note" x="55" y="375" width="480" height="130"/>
  <text class="label" x="295" y="411">硬保护条件</text>
  <text class="small" x="295" y="442">未知安全/规则数据 ≠ 安全</text>
  <text class="small" x="295" y="467">安全和严重规则优先于任务/询问</text>
  <text class="tiny" x="295" y="491">回退依赖场景，不等于自动冻结车辆</text>
</svg>
