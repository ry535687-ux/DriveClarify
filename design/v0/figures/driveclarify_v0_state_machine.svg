<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050" role="img" aria-labelledby="title desc">
  <title id="title">DriveClarify v0 交互状态机</title>
  <desc id="desc">七状态交互状态机，包括正常、歧义活动、问题已发送、保持中、收到回答、已提交和回退。ASK 发送问题并执行 holding；WAIT 不发送新问题并继续 holding。</desc>
  <defs>
    <marker id="smArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#334155;stroke-width:2.5;rx:20}.active{fill:#fff7ed;stroke:#c2410c}.question{fill:#fefce8;stroke:#a16207}.hold{fill:#fdf2f8;stroke:#be185d}.answer{fill:#eff6ff;stroke:#1d4ed8}.commit{fill:#ecfdf5;stroke:#047857}.fallback{fill:#fef2f2;stroke:#b91c1c;stroke-width:3}.title{font:700 30px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#0f172a}.label{font:700 20px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:400 14px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#475569;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#smArrow)}.fail{fill:none;stroke:#b91c1c;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#smArrow)}.edgeLabel{font:600 13px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#334155;text-anchor:middle}.note{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect class="bg" width="1680" height="1050"/>
  <text class="title" x="60" y="58">DriveClarify v0——持久交互状态机</text>
  <text x="60" y="88" style="font:400 16px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#475569">每个澄清回合一个问题 · WAIT 独立存在 · 回答绑定回合并重新校验 · 每次回退都记录原因</text>

  <rect class="node" x="55" y="200" width="220" height="125"/>
  <text class="label" x="165" y="244">NORMAL（正常）</text><text class="small" x="165" y="276">执行已验证普通计划</text><text class="small" x="165" y="299">没有活动歧义</text>
  <rect class="node active" x="340" y="180" width="260" height="165"/>
  <text class="label" x="470" y="224" style="font-size:16px">AMBIGUITY_ACTIVE（歧义活动）</text><text class="small" x="470" y="256">校验解释集合 Z 和计划</text><text class="small" x="470" y="279">后果 + 截止时间</text><text class="small" x="470" y="302">ACT / ASK / WAIT</text><text class="small" x="470" y="325">或进入回退</text>
  <rect class="node question" x="675" y="200" width="240" height="125"/>
  <text class="label" x="795" y="244" style="font-size:16px">QUESTION_SENT（问题已发）</text><text class="small" x="795" y="276">问题发送已确认</text><text class="small" x="795" y="299">预算只扣减一次</text>
  <rect class="node hold" x="990" y="180" width="240" height="165"/>
  <text class="label" x="1110" y="224">HOLDING（保持中）</text><text class="small" x="1110" y="256">WAIT：不发送新问题</text><text class="small" x="1110" y="279">执行 H1/H2/H3/H4</text><text class="small" x="1110" y="302">重查风险和剩余选项</text><text class="small" x="1110" y="325">有界超时</text>
  <rect class="node answer" x="1305" y="200" width="270" height="125"/>
  <text class="label" x="1440" y="244" style="font-size:16px">ANSWER_RECEIVED（收到回答）</text><text class="small" x="1440" y="276">匹配回合/问题标识</text><text class="small" x="1440" y="299">重新校验 + 重新生成</text>

  <path class="edge" d="M275 262 H340"/><text class="edgeLabel" x="308" y="246">新歧义</text>
  <path class="edge" d="M600 262 H675"/><text class="edgeLabel" x="638" y="246">ASK + 保持</text>
  <path class="edge" d="M915 262 H990"/><text class="edgeLabel" x="953" y="246">等待回答</text>
  <path class="edge" d="M1230 262 H1305"/><text class="edgeLabel" x="1268" y="246">有效回答</text>

  <rect class="node commit" x="705" y="525" width="270" height="145"/>
  <text class="label" x="840" y="570">COMMITTED（已提交）</text><text class="small" x="840" y="602">ACT 新生成的选中计划</text><text class="small" x="840" y="625">持续监控计划失效</text><text class="small" x="840" y="648">忽略旧回答</text>
  <path class="edge" d="M1440 325 V430 H975 V552"/><text class="edgeLabel" x="1210" y="416">及时有效回答 → 重规划</text>
  <path class="edge" d="M470 345 V445 H760 V525"/><text class="edgeLabel" x="610" y="432">单一有效 / 后果等价 / 鲁棒 ACT</text>
  <path class="edge" d="M1110 345 V475 H920 V525"/><text class="edgeLabel" x="1032" y="462">超时后的鲁棒 ACT</text>
  <path class="edge" d="M705 598 H550 V385 H165 V325"/><text class="edgeLabel" x="355" y="372">澄清回合结束 → NORMAL</text>
  <path class="edge" d="M840 525 V420 H520 V345"/><text class="edgeLabel" x="684" y="407">新指令 / 新歧义 / 计划失效</text>

  <path class="edge" d="M1305 292 H1260 V390 H1190 V345"/><text class="edgeLabel" x="1240" y="377">无效/仍歧义；可行时保持</text>
  <path class="edge" d="M990 310 H945 V390 H600 V310"/><text class="edgeLabel" x="795" y="377">提问前 WAIT 延长窗口</text>

  <rect class="node fallback" x="625" y="830" width="430" height="145"/>
  <text class="label" x="840" y="873">FALLBACK（回退）</text><text class="small" x="840" y="905">安全覆盖或鲁棒回退</text><text class="small" x="840" y="928">依赖场景，不等于自动停车</text><text class="small" x="840" y="951">恢复到 NORMAL 或开启新回合</text>

  <path class="fail" d="M470 345 H550 V760 H700 V830"/><text class="edgeLabel" x="400" y="744">零个有效候选 / 硬数据缺失</text>
  <path class="fail" d="M795 325 H650 V785 H760 V830"/><text class="edgeLabel" x="930" y="778">问题发送或保持策略失败</text>
  <path class="fail" d="M1110 345 V760 H975 V830"/><text class="edgeLabel" x="1190" y="744">超时 / 无安全保持策略</text>
  <path class="fail" d="M1440 325 H1625 V790 H1015 V830"/><text class="edgeLabel" x="1300" y="775">过期或不可行回答</text>
  <path class="fail" d="M840 670 V830"/><text class="edgeLabel" x="730" y="755">已提交计划变得不安全</text>
  <path class="edge" d="M625 902 H30 V140 H165 V200"/><text class="edgeLabel" x="300" y="887">安全恢复 → NORMAL / 新回合</text>

  <rect class="note" x="70" y="510" width="430" height="175"/>
  <text class="label" x="285" y="548">语义动作 ≠ 车辆运动命令</text>
  <text class="small" x="285" y="580">ASK = 发送一个模板问题</text>
  <text class="small" x="285" y="605">+ 执行经过验证的保持策略</text>
  <text class="small" x="285" y="632">WAIT = 不发新问题 + 保持策略</text>
  <text class="small" x="285" y="657">立即停车只是一种基线或候选</text>

  <rect class="note" x="1180" y="515" width="420" height="170"/>
  <text class="label" x="1390" y="553">回答采用门</text>
  <text class="small" x="1390" y="585">ID 匹配 · 尚未过期</text>
  <text class="small" x="1390" y="610">解释当前仍可行</text>
  <text class="small" x="1390" y="635">新计划已重生成并通过硬检查</text>
  <text class="small" x="1390" y="660">提交后迟到回答：记录并忽略</text>
</svg>
