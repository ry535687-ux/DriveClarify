[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driveclarify"
version = "0.2.0"
description = "Selective clarification using task consequences, temporal evidence and answer binding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
driveclarify = "driveclarify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["driveclarify*"]
namespaces = false

[tool.setuptools.package-data]
driveclarify = ["resources/*", "resources/upstream_extra/team_code/*.py", "resources/upstream_extra/simlingo_training/*.py", "resources/upstream_extra/simlingo_training/config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

