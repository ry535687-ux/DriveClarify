name: CPU reproduction
on:
  push:
    branches: [main]
  pull_request:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned tools and build wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/cpu.lock.txt
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir build/wheels .
          python -m pip install --no-deps build/wheels/*.whl
          python -m pip check
      - name: Test installed package and evaluate controlled inputs
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest
          driveclarify evaluate --output build/evaluation
          python -m compileall -q src/driveclarify

